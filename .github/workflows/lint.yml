
name: Auto Linter

on:
  push:
    paths:
      - '**.py'

jobs:
  code:
    runs-on: ubuntu-latest

    steps:
      - name: Clone the code
        uses: actions/checkout@v4

      - name: Install Linter
        run: pip install ruff

      
      - name: Check and fix linting
        run: ruff check . --fix

        
        
        
        
    
